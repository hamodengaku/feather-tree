<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      本体（index.html）と同じ方針。スプラッシュは IPC も外部リソースも使わないので、
      connect-src は開発サーバの HMR 用だけに絞ってある。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src ws://localhost:* http://localhost:*"
    />
    <title>FeatherTree</title>
  </head>
  <body>
    <div id="splash"></div>
    <script type="module" src="/src/splash.ts"></script>
  </body>
</html>
