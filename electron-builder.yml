appId: com.feathertree.app
productName: FeatherTree
copyright: FeatherTree

directories:
  output: release

# out/ は electron-vite がバンドル済み。実行時 npm 依存はゼロなので node_modules は含めない。
files:
  - out/**/*
  - package.json

# Electron 本体 zip の取得先。既定は %LOCALAPPDATA%electronCache だが、
# CLAUDE.md 規約 2（リポジトリ外に書かない）によりリポジトリ内へ向ける。
electronDownload:
  cache: .cache/electron

asar: true
compression: maximum

# Chromium が持ち込む WebGPU 用 DLL（dxcompiler / dxil、計約 26MB）を削る（決定 5）。
# files は app 側にしか効かないので、Electron 本体のファイルはこのフックで消すしかない。
# 成果物の作成前に呼ばれるため、NSIS インストーラにも zip にも含まれない。
afterPack: scripts/afterPack.mjs

# 不要ロケールを落として配布サイズを削る
electronLanguages:
  - ja
  - en-US

# Electron Fuses（脆弱性診断 §7 Medium）。既定では RunAsNode 等が有効なままパッケージされ、
# 配布 exe に ELECTRON_RUN_AS_NODE=1 や NODE_OPTIONS を設定して起動すると Node ランタイムとして
# 任意コードを実行できてしまう。nodeIntegration を使っていないため通常経路での悪用は難しいが、
# この経路自体は塞いでおく。キー名は node_modules/app-builder-lib/scheme.json の
# FuseOptionsV1 で確認済み（@electron/fuses の FuseV1Options に対応）。
#
# 実行順序の確認（app-builder-lib/out/platformPackager.js の pack()）:
#   1. copyAppFiles で resources/app.asar を作る
#   2. asar 整合性ハッシュを計算（app.asar の内容のみが対象）
#   3. emitAfterPack → afterPack フック（scripts/afterPack.mjs、appOutDir 直下の
#      dxcompiler.dll / dxil.dll を削除。app.asar の外なので 2. のハッシュに影響しない）
#   4. framework.afterPack（Electron 側の内部フック）→ sanityCheckPackage
#   5. doAddElectronFuses（"fuses MUST be flipped right before signing" とコメントあり）
#      → @electron/fuses の flipFuses が実行ファイル本体（appOutDir/FeatherTree.exe）に
#        2. のハッシュを埋め込みつつフューズを書き込む
#   6. 署名（forceCodeSigning: false なので実質スキップ）
# afterPack（3.）は exe 本体も app.asar も書き換えないため、フューズ書き込み（5.）や
# asar 整合性ハッシュの計算（2.）と衝突しない。scripts/dist.mjs の
# --config.electronDownload.cache 等（Electron 本体 zip の取得先）ともファイルが別なので無関係。
#
# 未署名配布（forceCodeSigning: false）では enableEmbeddedAsarIntegrityValidation の効果は
# 限定的（署名が無ければ exe 自体の改変を検出できない）。それでも app.asar 単体の改竄検出には
# 意味があるため有効にする。enableCookieEncryption は既存のクッキーとの一方向変換であり
# 挙動への影響を精査していないため今回は触らない。
#
# grantFileProtocolExtraPrivileges（既定 true）は無効化した。本番の renderer / splash は
# file:// から loadFile している（packages/main/src/index.ts:192, splashWindow.ts:97）が、
# このフューズが与える特権（file:// からの fetch、service worker、file:// 間 iframe の
# sandbox 越え）はいずれも使っていない（packages/renderer/src を検索して fetch() /
# serviceWorker 登録 / iframe が無いことを確認済み。`app.fetch` は git fetch を指す
# IPC メソッド名で、ブラウザの fetch API ではない）。
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # grantFileProtocolExtraPrivileges は落とせない（2026-09-17 の実測）。
  # この権限には file:// URL の中の .asar をアーカイブとして辿る扱いが含まれるため、
  # false にすると app.asar 内の index.html / splash.html が ERR_FILE_NOT_FOUND になり
  # 画面が一切出ない。既定（有効）のまま残す。

win:
  # アイコンは .ico を直接渡す。PNG を渡すと electron-builder が機械的に縮小して
  # 全サイズを作ってしまい、16px / 20px が潰れるため（build/icon/README.md）。
  # この .ico は scripts/make-icon.mjs が build/icon/*.png を詰めて作る（縮小はしない）。
  # 生成物なので版管理していない。`npm run icon` で作り直す（dist が前段で自動実行する）。
  # 同じスクリプトが mac 用の build/icon.icns も作る（mac: セクション）。
  icon: build/icon.ico
  # zip の artifactName（決定 5・2026-09-13 改定）。
  # NSIS は自分専用の artifactName（nsis: セクション）を持つので、ここは実質 zip にしか効かない
  # （zip はターゲット固有のオプションを持たないため、この win 直下の値まで降りてくる）。
  # トップレベルに置くと mac の成果物まで win-x64 という名前になるので、win の下に置く。
  artifactName: FeatherTree-${version}-win-x64.${ext}
  # exe の隣に LICENSE.txt を置く。
  extraFiles:
    - from: LICENSE
      to: LICENSE.txt
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

# macOS 版。universal（arm64 + x64 を 1 つの .app に）で dmg と zip を出す。
mac:
  # アイコンは .icns を直接渡す。理由は win.icon と同じで、サイズごとに描いた素材を
  # 機械的な縮小で潰さないため。scripts/make-icon.mjs が .ico と一緒に作る生成物
  # （版管理しない）。dmg のボリュームアイコンも、指定が無ければこれが使われる。
  icon: build/icon.icns
  category: public.app-category.developer-tools
  artifactName: FeatherTree-${version}-mac-universal.${ext}
  # 未署名配布（Windows 版と同じ方針）。ただし arm64 は署名が全く無いバイナリを起動できないため、
  # 証明書の要らない ad-hoc 署名（"-"）だけは掛ける。Gatekeeper の警告は出る（README に対処を記載）。
  identity: '-'
  # hardened runtime は公証のための仕組みで、公証しない ad-hoc 署名では得が無い。
  # 有効にすると Team ID の無い署名同士でライブラリ検証に落ちることがあるので切る。
  hardenedRuntime: false
  # LICENSE は Contents/Resources に置く。extraFiles だと Contents 直下に入り、
  # 署名対象外のファイルが混ざったとして codesign が失敗する（2026-09-30 実測）。
  extraResources:
    - from: LICENSE
      to: LICENSE.txt
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal

# ワンクリック・インストーラ（主。決定 5・2026-09-13 改定。旧 portable ターゲットは廃止）。
# ユーザー単位（perMachine: false）で管理者権限不要。userData の置き場は
# packages/base-electron/src/paths.ts の resolveUserDataDir を参照。
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FeatherTree
  # アンインストール時に userData（%APPDATA%\FeatherTree）を消さない（決定 5）
  deleteAppDataOnUninstall: false
  artifactName: FeatherTree-Setup-${version}.exe
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

# publish は使わない（決定 22。ビルドは人間が手動で GitHub Releases へ上げる）。
# undefined のままだと GH_TOKEN が環境にあるときに electron-builder が
# publish 先の解決を試みることがあるため、明示的に null で止める
# （scripts/dist.mjs の --publish never と二重で誤アップロードを防ぐ）。
publish: null

# 未署名配布（README に SmartScreen 警告の注意を記載する）
forceCodeSigning: false
